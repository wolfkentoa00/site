<!DOCTYPE html>
<html>
<head>
    <title>GPX Run Generator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Floating Control Panel */
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 300px;
        }
        h2 { margin-top: 0; font-size: 18px; color: #333; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .info { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="controls">
        <h2>Run Generator</h2>
        
        <div class="input-group">
            <label>Avg Pace (min/km)</label>
            <input type="text" id="pace" value="5:00" placeholder="e.g. 5:00">
        </div>

        <div class="input-group">
            <label>Avg Heart Rate (bpm)</label>
            <input type="number" id="hr" value="145">
        </div>

        <div class="input-group">
            <label>Run Start Time</label>
            <input type="datetime-local" id="startTime">
        </div>

        <button onclick="downloadGPX()">Download GPX</button>
        <p class="info">
            <strong>Instructions:</strong> Click on the map to set a Start point. Click again to set the End point. A blue line will snap to the roads automatically.
        </p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // 1. Initialize Map
        var map = L.map('map').setView([40.7128, -74.0060], 13); // Default to NYC, user can move
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Set default start time to "Now"
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('startTime').value = now.toISOString().slice(0,16);

        // 2. Routing Logic
        var control = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true,
            show: false, // Hide the turn-by-turn text box
            createMarker: function(i, wp, nWps) {
                // Simple markers for Start (Green) and End (Red)
                var color = (i === 0) ? 'green' : 'red';
                return L.marker(wp.latLng, { draggable: true });
            }
        }).addTo(map);

        // Handle Map Clicks to add Waypoints
        map.on('click', function(e) {
            var waypoints = control.getWaypoints();
            // Remove empty waypoints if any
            waypoints = waypoints.filter(wp => wp.latLng);

            if (waypoints.length >= 2) {
                // If we already have a route, reset it to the new click
                control.setWaypoints([e.latlng]);
            } else {
                // Otherwise add the point to the list
                waypoints.push(L.Routing.waypoint(e.latlng));
                control.setWaypoints(waypoints);
            }
        });

        // 3. GPX Generation Logic
        function downloadGPX() {
            // Get the route data
            if (!control._routes || control._routes.length === 0) {
                alert("Please create a route on the map first!");
                return;
            }

            var route = control._routes[0]; // The calculated route
            var coordinates = route.coordinates; // Array of {lat, lng} objects
            
            // Get User Inputs
            var paceInput = document.getElementById('pace').value; // "5:00"
            var [min, sec] = paceInput.split(':').map(Number);
            var secPerKm = (min * 60) + sec;
            
            var baseHR = parseInt(document.getElementById('hr').value);
            var startTime = new Date(document.getElementById('startTime').value);

            // XML Header
            var gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="RunGenerator" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">
  <trk>
    <name>Generated Run</name>
    <trkseg>`;

            // Loop through coordinates to calculate time and HR
            var totalDist = 0;
            
            for (var i = 0; i < coordinates.length; i++) {
                var lat = coordinates[i].lat;
                var lng = coordinates[i].lng;
                
                // Calculate distance from previous point to add to time
                if (i > 0) {
                    var prev = coordinates[i-1];
                    var dist = map.distance([prev.lat, prev.lng], [lat, lng]); // Distance in meters
                    totalDist += dist;
                }

                // Calculate timestamp
                // Time = (Distance (km) * SecondsPerKm) added to StartTime
                var timeOffsetSeconds = (totalDist / 1000) * secPerKm;
                var currentTime = new Date(startTime.getTime() + (timeOffsetSeconds * 1000));
                
                // Generate Fake Heart Rate (Base + random noise)
                // Add simple noise (-3 to +3 bpm)
                var noise = Math.floor(Math.random() * 7) - 3; 
                var currentHR = baseHR + noise;

                // Format Time to ISO String (2023-10-25T12:00:00Z)
                var timeStr = currentTime.toISOString();

                // Append Point to XML
                gpx += `
      <trkpt lat="${lat}" lon="${lng}">
        <time>${timeStr}</time>
        <extensions>
          <gpxtpx:TrackPointExtension>
            <gpxtpx:hr>${currentHR}</gpxtpx:hr>
          </gpxtpx:TrackPointExtension>
        </extensions>
      </trkpt>`;
            }

            // Close XML
            gpx += `
    </trkseg>
  </trk>
</gpx>`;

            // Trigger Download
            var blob = new Blob([gpx], { type: 'application/gpx+xml' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = "run_with_heartrate.gpx";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
