<!DOCTYPE html>
<html>
<head>
    <title>Route Builder (Miles + Steps)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 280px;
        }
        h2 { margin-top: 0; font-size: 18px; color: #333; margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #34C759; /* Apple Health Green */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover { background-color: #2da84a; }
        button#reset { background-color: #ff3b30; margin-top: 10px; }
        
        .status { font-size: 12px; margin-top: 10px; color: #666; text-align: center; }
        .hint { font-size: 10px; color: #888; margin-top: 2px; }
    </style>
</head>
<body>

    <div id="controls">
        <h2>Run Planner Pro</h2>
        
        <div class="input-group">
            <label>Pace (min/mile)</label>
            <input type="text" id="pace" value="8:30">
        </div>

        <div class="input-group">
            <label>Avg Heart Rate (bpm)</label>
            <input type="number" id="hr" value="150">
        </div>

        <div class="input-group">
            <label>Cadence / Steps Per Min</label>
            <input type="number" id="cadence" value="170">
            <div class="hint">Walk: ~110 | Run: ~170</div>
        </div>

        <div class="input-group">
            <label>Start Time</label>
            <input type="datetime-local" id="startTime">
        </div>

        <button onclick="downloadGPX()">Download GPX</button>
        <button id="reset" onclick="resetMap()">Reset Map</button>
        <div class="status" id="statusMsg">Click map to plot route...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // --- 1. SETUP MAP ---
        var map = L.map('map').setView([40.7128, -74.0060], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Set default time
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('startTime').value = now.toISOString().slice(0,16);

        var calculatedRoute = null;

        // --- 2. ROUTING ENGINE ---
        var control = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true,
            show: false,
            lineOptions: { styles: [{color: '#007AFF', opacity: 0.8, weight: 6}] },
            createMarker: function(i, wp, nWps) {
                return L.marker(wp.latLng, { draggable: true });
            }
        }).addTo(map);

        control.on('routesfound', function(e) {
            calculatedRoute = e.routes[0];
            var distMiles = (calculatedRoute.summary.totalDistance / 1609.34).toFixed(2);
            document.getElementById('statusMsg').innerText = `Distance: ${distMiles} miles`;
        });

        // --- 3. CLICK HANDLER ---
        map.on('click', function(e) {
            var waypoints = control.getWaypoints().filter(wp => wp.latLng);
            waypoints.push(L.Routing.waypoint(e.latlng));
            control.setWaypoints(waypoints);
            document.getElementById('statusMsg').innerText = "Calculating...";
        });

        function resetMap() {
            control.setWaypoints([]);
            calculatedRoute = null;
            document.getElementById('statusMsg').innerText = "Map cleared.";
        }

        // --- 4. GENERATE GPX ---
        function downloadGPX() {
            if (!calculatedRoute) {
                alert("Please draw a route first!");
                return;
            }

            // Inputs
            var paceInput = document.getElementById('pace').value; 
            var [min, sec] = paceInput.split(':').map(Number);
            if (isNaN(min)) min = 9; if (isNaN(sec)) sec = 0;

            // Speed Math (Miles to Meters)
            var secondsPerMile = (min * 60) + sec;
            var secondsPerMeter = secondsPerMile / 1609.34;

            var baseHR = parseInt(document.getElementById('hr').value) || 150;
            var baseCadence = parseInt(document.getElementById('cadence').value) || 170;
            var startTime = new Date(document.getElementById('startTime').value);

            // XML Header
            var gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="RunBuilderPro" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">
  <trk>
    <name>Generated Run</name>
    <trkseg>`;

            // Loop Coordinates
            var coordinates = calculatedRoute.coordinates;
            var totalDistMeters = 0;

            for (var i = 0; i < coordinates.length; i++) {
                var lat = coordinates[i].lat;
                var lng = coordinates[i].lng;

                // Distance calculation
                if (i > 0) {
                    var prev = coordinates[i-1];
                    var p1 = L.latLng(prev.lat, prev.lng);
                    var p2 = L.latLng(lat, lng);
                    totalDistMeters += p1.distanceTo(p2);
                }

                // Time Calculation
                var timeOffsetSeconds = totalDistMeters * secondsPerMeter;
                var currentTime = new Date(startTime.getTime() + (timeOffsetSeconds * 1000));

                // 1. Fake Heart Rate (with drift and noise)
                var hrNoise = Math.floor(Math.random() * 6) - 3;
                var hrDrift = (i / coordinates.length) * 8; // HR rises slightly over time
                var currentHR = Math.round(baseHR + hrNoise + hrDrift);

                // 2. Fake Cadence (Steps) - Add variety so it looks real
                var cadNoise = Math.floor(Math.random() * 4) - 2; 
                // If moving very slow (start/end), drop cadence
                var currentCad = (i < 5 || i > coordinates.length - 5) ? Math.round(baseCadence * 0.8) : Math.round(baseCadence + cadNoise);

                var timeStr = currentTime.toISOString();

                // Append GPX Point with EXTENSIONS (HR + Cadence)
                gpx += `
      <trkpt lat="${lat}" lon="${lng}">
        <time>${timeStr}</time>
        <extensions>
          <gpxtpx:TrackPointExtension>
            <gpxtpx:hr>${currentHR}</gpxtpx:hr>
            <gpxtpx:cad>${currentCad}</gpxtpx:cad>
          </gpxtpx:TrackPointExtension>
        </extensions>
      </trkpt>`;
            }

            // Close File
            gpx += `
    </trkseg>
  </trk>
</gpx>`;

            // Download
            var blob = new Blob([gpx], { type: 'application/gpx+xml' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = "run_with_steps.gpx";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
